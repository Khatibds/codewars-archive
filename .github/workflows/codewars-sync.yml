name: Sync Codewars Solutions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Codewars
        run: |
          node -e '
          const fs = require("fs");
          const username = "Khatibds";

          async function fetchWithDelay(url, delayMs = 250) {
            await new Promise(res => setTimeout(res, delayMs));
            return fetch(url);
          }

          async function main() {
            let page = 0;
            let totalPages = 1;
            const allKatas = [];

            while (page < totalPages) {
              const res = await fetch(`https://www.codewars.com/api/v1/users/${username}/code-challenges/completed?page=${page}`);
              if (!res.ok) {
                console.error(`Failed to fetch user completions: HTTP ${res.status}`);
                break;
              }
              const data = await res.json();
              if (!data.data || data.data.length === 0) break;

              totalPages = data.totalPages || 1;
              allKatas.push(...data.data);
              page++;
            }

            if (allKatas.length === 0) {
              console.log("No data returned or user not found.");
              return;
            }

            // Fetch rank for each challenge
            const enrichedKatas = [];
            for (const kata of allKatas) {
              try {
                const kataRes = await fetchWithDelay(`https://www.codewars.com/api/v1/code-challenges/${kata.id}`);
                if (kataRes.ok) {
                  const kataData = await kataRes.json();
                  kata.rankName = kataData.rank?.name || "N/A";
                } else {
                  kata.rankName = "N/A";
                }
              } catch (e) {
                kata.rankName = "N/A";
              }
              enrichedKatas.push(kata);
            }

            fs.writeFileSync("COMPLETED_KATAS.json", JSON.stringify(enrichedKatas, null, 2));

            let markdown = "# Codewars Completed Challenges\n\n";
            markdown += `Total Completed: **${enrichedKatas.length}**\n\n`;
            markdown += "| Challenge | Rank | Languages | Completed At |\n| --- | --- | --- | --- |\n";

            for (const item of enrichedKatas) {
              const langs = (item.completedLanguages || []).join(", ");
              const date = item.completedAt ? item.completedAt.split("T")[0] : "N/A";
              markdown += `| [${item.name}](https://www.codewars.com/kata/${item.id}) | ${item.rankName} | ${langs} | ${date} |\n`;
            }

            fs.writeFileSync("README.md", markdown);
          }

          main();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md COMPLETED_KATAS.json
          git commit -m "Auto-sync Codewars completed katas with ranks" || echo "No changes to commit"
          git push
